<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Aksata Cerita</title>
<style>
:root{--blue:#0022ff;--ink:#111;--muted:#777;--line:#e4e4e1;--soft:#f6f6f3;--red:#d22}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.45 "DM Sans",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;margin-right:auto;letter-spacing:-.3px}
header small{color:var(--muted)}
.btn{border:0;background:var(--blue);color:#fff;font-weight:700;font-size:12px;min-height:42px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{min-height:34px;padding:6px 12px}
nav{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--blue);border-color:var(--blue)}
main{max-width:980px;margin:18px auto;padding:0 14px 90px}
.panel{background:#fff;border:1px solid var(--line);padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0 auto 0 0;font-size:20px}
.head h2 small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.bulk{display:none;flex-wrap:wrap;gap:8px;align-items:center;background:#eef1ff;border:1px solid var(--blue);padding:10px 12px;margin-bottom:12px}
.bulk.on{display:flex}
.bulk .cnt{margin-right:auto;font-size:12px;color:#444}
.row{position:relative;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 8px 12px 30px;border-top:1px solid #eee;background:#fff}
.row.off{opacity:.55}
.row.sel{background:#f2f4ff}
.row.dragging{background:#eef1ff;outline:2px solid var(--blue);box-shadow:0 8px 24px #0002;z-index:5}
.handle{position:absolute;left:0;top:50%;transform:translateY(-50%);width:26px;height:40px;display:grid;place-items:center;color:#999;font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.thumb{width:48px;height:48px;background:#eef0ff;object-fit:cover;display:grid;place-items:center;color:var(--blue);font-weight:700}
.row b{display:block;font-size:13px}.row small{color:var(--muted);font-size:11px}
.badge{background:#ff6738;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;margin-left:6px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acts button{border:0;background:none;cursor:pointer;font-weight:600;font-size:12px;padding:6px 8px}
.acts .del{color:var(--red)}
.chk{display:none;width:20px;height:20px;accent-color:var(--blue)}
body.selecting .chk{display:inline-block}
body.selecting .acts .del{display:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
body.sorting{user-select:none;-webkit-user-select:none;cursor:grabbing}
.modal{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px}
.modal.on{display:flex}
.card{background:#fff;width:min(560px,100%);padding:22px;margin:auto}
.card h3{margin:0 0 14px;font-size:18px}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:12px}
label.f>span.req{color:var(--red)}
.f input[type=text],.f input[type=number],.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #ccc;background:#fff;font-weight:400}
.f textarea{min-height:90px;resize:vertical}
.f input[type=color]{display:block;margin-top:6px;width:56px;height:38px;padding:2px;border:1px solid #ccc;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid #ddd;background:#fff;border-radius:30px;padding:4px 11px;font-size:11px;cursor:pointer}
.chips button:hover{border-color:var(--blue);color:var(--blue)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;margin:0 0 14px}
.switch input{width:20px;height:20px;accent-color:var(--blue)}
.imgbox{margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgbox img{max-width:120px;max-height:120px;border:1px solid var(--line);background:#f0f0f0}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.grp{margin:22px 0 10px;font:700 11px "DM Sans";letter-spacing:1.5px;color:var(--blue)}
.err{color:var(--red);font-size:12px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;font-size:13px;z-index:90;display:none;max-width:90vw}
#toast.on{display:block}#toast.bad{background:var(--red)}
#gate{padding:50px 20px;text-align:center}
@media (max-width:640px){.row{grid-template-columns:44px 1fr}.acts{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Admin Aksata Cerita <small id="who"></small></h1>
  <span id="dirty" style="display:none;font-size:12px;color:#c60">Ada perubahan yang belum diterbitkan</span>
  <button class="btn" id="publish" disabled>Terbitkan ke situs</button>
</header>
<nav id="tabs"></nav>
<main id="view"><div id="gate">Memuat…</div></main>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var run = function (fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message.replace(/^Error:\s*/, '') : String(e))); })[fn].apply(null, args);
    });
  };
  var S = null;           // state dari server
  var tab = 'paket';
  var selecting = false;
  var toastTimer;

  var toast = function (msg, bad) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, bad ? 6000 : 2800);
  };
  var setDirty = function (on) {
    $('#dirty').style.display = on ? '' : 'none';
  };
  var imgSrc = function (u) {
    if (!u) return '';
    if (/^(https?:|data:)/.test(u)) return u;
    return S.assetBase ? S.assetBase + u : '';
  };
  var parseList = function (v) { return String(v || '').split(/[,\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); };
  var rowsOf = function (kind) { return S.data[kind]; };

  /* ---------- Tabs ---------- */
  function renderTabs() {
    var items = ['paket', 'frame', 'galeri', 'instagram'].map(function (k) { return [k, S.schema[k].label]; }).concat([['info', 'Info Studio']]);
    $('#tabs').innerHTML = items.map(function (it) { return '<button data-t="' + it[0] + '" class="' + (it[0] === tab ? 'on' : '') + '">' + esc(it[1]) + '</button>'; }).join('');
  }
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.t; selecting = false; document.body.classList.remove('selecting'); renderTabs(); render();
  });

  /* ---------- Daftar ---------- */
  function subtitle(kind, r) {
    if (kind === 'paket') return 'Rp' + Number(r.price_amount || 0).toLocaleString('id-ID') + (r.duration_value ? ' · ' + r.duration_value + ' ' + (r.duration_unit || 'menit') : '');
    if (kind === 'frame') return [r.type, r.size, r.label].filter(Boolean).join(' · ');
    if (kind === 'galeri') return r.category || '';
    return '';
  }
  function titleOf(kind, r) {
    var def = S.schema[kind];
    var t = r[def.titleKey] || '(tanpa judul)';
    return kind === 'instagram' ? String(t).replace('https://www.instagram.com/', '') : t;
  }
  function renderList() {
    var kind = tab, def = S.schema[kind], rows = rowsOf(kind);
    var html = '<div class="panel"><div class="head"><h2>' + rows.length + ' ' + def.singular + '<small>Urutan di sini = urutan di situs. Tahan ⠿ lalu geser untuk memindahkan.</small></h2>' +
      '<button class="btn ghost" id="selBtn">' + (selecting ? 'Batal' : 'Pilih') + '</button>' +
      '<button class="btn" id="addBtn">+ Tambah ' + def.singular + '</button></div>' +
      '<div class="bulk ' + (selecting ? 'on' : '') + '" id="bulk"><label><input type="checkbox" id="selAll" class="chk" style="display:inline-block"> Pilih semua</label><span class="cnt" id="cnt">Pilih item untuk aksi massal</span>' +
      '<button class="btn sm ghost" data-bulk="show" disabled>Tampilkan</button><button class="btn sm ghost" data-bulk="hide" disabled>Sembunyikan</button><button class="btn sm danger" data-bulk="delete" disabled>Hapus</button></div>' +
      '<div id="list">';
    if (!rows.length) html += '<div class="empty">Belum ada data. Klik "+ Tambah ' + esc(def.singular) + '" untuk mulai.</div>';
    rows.forEach(function (r) {
      var src = imgSrc(r.image);
      html += '<div class="row ' + (r.active ? '' : 'off') + '" data-id="' + esc(r.id) + '"><span class="handle" title="Tahan lalu geser">⠿</span>' +
        (def.imgDir !== null || kind === 'frame' || kind === 'galeri' ? (src ? '<img class="thumb" src="' + esc(src) + '" alt="" onerror="this.outerHTML=\'<div class=thumb>!</div>\'">' : '<div class="thumb">·</div>') : '<div class="thumb">' + (kind === 'paket' ? '★' : '◎') + '</div>') +
        '<div><b>' + esc(titleOf(kind, r)) + (r.is_featured ? '<span class="badge">UNGGULAN</span>' : '') + (r.active ? '' : ' (disembunyikan)') + '</b><small>' + esc(subtitle(kind, r)) + '</small></div>' +
        '<div class="acts"><input type="checkbox" class="chk" data-sel="' + esc(r.id) + '"><button data-edit="' + esc(r.id) + '">Ubah</button><button class="del" data-del="' + esc(r.id) + '">Hapus</button></div></div>';
    });
    html += '</div></div>';
    $('#view').innerHTML = html;
    updateBulk();
  }

  function updateBulk() {
    var boxes = Array.prototype.slice.call(document.querySelectorAll('#list [data-sel]'));
    var n = boxes.filter(function (b) { return b.checked; }).length;
    var cnt = $('#cnt'); if (!cnt) return;
    cnt.textContent = n ? n + ' dipilih' : 'Pilih item untuk aksi massal';
    Array.prototype.forEach.call(document.querySelectorAll('#bulk [data-bulk]'), function (b) { b.disabled = n === 0; });
    var all = $('#selAll'); all.checked = n > 0 && n === boxes.length; all.indeterminate = n > 0 && n < boxes.length;
    boxes.forEach(function (b) { b.closest('.row').classList.toggle('sel', b.checked); });
  }

  async function persist(kind, rows, okMsg) {
    try {
      S.data[kind] = await run('api_saveRows', kind, rows);
      setDirty(true);
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) { toast(e.message, true); return false; }
  }

  document.addEventListener('click', async function (e) {
    var t = e.target;
    if (t.id === 'selBtn') { selecting = !selecting; document.body.classList.toggle('selecting', selecting); render(); return; }
    if (t.id === 'addBtn') { openForm(tab, null); return; }
    var edit = t.closest('[data-edit]'); if (edit) { openForm(tab, edit.dataset.edit); return; }
    var del = t.closest('[data-del]');
    if (del) {
      var r = rowsOf(tab).filter(function (x) { return x.id === del.dataset.del; })[0];
      if (r && confirm('Hapus "' + titleOf(tab, r) + '"?')) { if (await persist(tab, rowsOf(tab).filter(function (x) { return x !== r; }), 'Dihapus.')) render(); }
      return;
    }
    var bulk = t.closest('[data-bulk]');
    if (bulk && !bulk.disabled) {
      var ids = Array.prototype.slice.call(document.querySelectorAll('#list [data-sel]:checked')).map(function (b) { return b.dataset.sel; });
      var act = bulk.dataset.bulk, rows = rowsOf(tab);
      if (act === 'delete') {
        if (!confirm('Hapus ' + ids.length + ' item yang dipilih? Tidak bisa dibatalkan.')) return;
        rows = rows.filter(function (x) { return ids.indexOf(x.id) === -1; });
      } else {
        rows = rows.map(function (x) { if (ids.indexOf(x.id) !== -1) x.active = act === 'show'; return x; });
      }
      if (await persist(tab, rows, 'Selesai.')) render();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'selAll') { Array.prototype.forEach.call(document.querySelectorAll('#list [data-sel]'), function (b) { b.checked = e.target.checked; }); updateBulk(); }
    else if (e.target.matches && e.target.matches('[data-sel]')) updateBulk();
  });

  /* ---------- Geser urutan (mouse & sentuh) ---------- */
  var drag = null, pending = null, HOLD = 350;
  function rowsEls() { return Array.prototype.slice.call(document.querySelectorAll('#list .row')); }
  function startDrag(el, x, y) {
    drag = { el: el, x: x, y: y, start: rowsEls().indexOf(el), raf: 0 };
    el.classList.add('dragging'); document.body.classList.add('sorting');
    if (navigator.vibrate) navigator.vibrate(15);
    var tick = function () {
      if (!drag) return;
      if (drag.y < 70) window.scrollBy(0, -Math.ceil((70 - drag.y) / 5));
      else if (drag.y > innerHeight - 70) window.scrollBy(0, Math.ceil((drag.y - (innerHeight - 70)) / 5));
      var over = rowsEls().filter(function (r) { if (r === drag.el) return false; var b = r.getBoundingClientRect(); return drag.x >= b.left && drag.x <= b.right && drag.y >= b.top && drag.y <= b.bottom; })[0];
      if (over) { var after = drag.el.compareDocumentPosition(over) & Node.DOCUMENT_POSITION_FOLLOWING; over.parentNode.insertBefore(drag.el, after ? over.nextSibling : over); }
      drag.raf = requestAnimationFrame(tick);
    };
    drag.raf = requestAnimationFrame(tick);
  }
  async function endDrag(save) {
    if (!drag) return;
    var d = drag; drag = null; cancelAnimationFrame(d.raf);
    d.el.classList.remove('dragging'); document.body.classList.remove('sorting');
    var order = rowsEls().map(function (r) { return r.dataset.id; });
    if (!save || rowsEls().indexOf(d.el) === d.start) { if (!save) render(); return; }
    var byId = {}; rowsOf(tab).forEach(function (r) { byId[r.id] = r; });
    var ok = await persist(tab, order.map(function (id) { return byId[id]; }), 'Urutan tersimpan.');
    if (!ok) render();
  }
  document.addEventListener('pointerdown', function (e) {
    var row = e.target.closest && e.target.closest('#list .row'); if (!row || e.button > 0) return;
    if (e.target.closest('.handle')) { e.preventDefault(); startDrag(row, e.clientX, e.clientY); return; }
    if (e.target.closest('button, input, a, select, textarea')) return;
    var p = { x: e.clientX, y: e.clientY };
    p.timer = setTimeout(function () { if (pending === p) { pending = null; startDrag(row, p.x, p.y); } }, HOLD);
    pending = p;
  });
  document.addEventListener('pointermove', function (e) {
    if (pending && Math.hypot(e.clientX - pending.x, e.clientY - pending.y) > 8) { clearTimeout(pending.timer); pending = null; }
    if (drag) { drag.x = e.clientX; drag.y = e.clientY; }
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { document.addEventListener(t, function () { if (pending) { clearTimeout(pending.timer); pending = null; } endDrag(t === 'pointerup'); }); });
  document.addEventListener('touchmove', function (e) { if (drag && e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { if (drag || pending) e.preventDefault(); });

  /* ---------- Formulir tambah / ubah ---------- */
  var PRESETS = ['#0022ff', '#ff6738', '#ff79b8', '#b7e433', '#8b5cf6', '#14b8a6', '#ef4444', '#f5b301'];
  function fieldHtml(f, v) {
    var req = f.req ? ' <span class="req">*</span>' : '';
    var name = 'data-k="' + f.k + '"';
    if (f.t === 'bool') return '<label class="switch"><input type="checkbox" ' + name + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
    var inner;
    if (f.t === 'longtext' || f.t === 'list') inner = '<textarea ' + name + '>' + esc(v) + '</textarea>';
    else if (f.t === 'number') inner = '<input type="number" inputmode="numeric" min="0" ' + name + ' value="' + esc(v) + '">';
    else if (f.t === 'select') inner = '<select ' + name + '>' + f.opts.map(function (o) { return '<option value="' + o + '"' + ((v || f.opts[0]) === o ? ' selected' : '') + '>' + esc((f.optLabels && f.optLabels[o]) || o) + '</option>'; }).join('') + '</select>';
    else if (f.t === 'color') inner = '<input type="color" ' + name + ' value="' + esc(/^#[0-9a-f]{6}$/i.test(v) ? v : '#0022ff') + '"><div class="chips">' + PRESETS.map(function (c) { return '<button type="button" data-color="' + c + '" style="background:' + c + ';width:26px;height:26px;border-radius:50%;padding:0"></button>'; }).join('') + '</div>';
    else if (f.t === 'image') inner = '<div class="imgbox"><img ' + (v ? 'src="' + esc(imgSrc(v)) + '"' : 'style="display:none"') + ' id="imgPrev" alt=""><input type="file" accept="image/*" id="imgFile"><input type="hidden" ' + name + ' value="' + esc(v) + '"></div><div id="imgMsg" style="font-size:11px;color:#777;margin-top:4px">Foto otomatis diperkecil sebelum diunggah.</div>';
    else {
      inner = '<input type="text" ' + name + ' value="' + esc(v) + '">';
      if (f.list) inner += '<div class="chips">' + parseList(S.settings[f.list]).map(function (o) { return '<button type="button" data-fill="' + f.k + '" data-val="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    }
    return '<label class="f">' + esc(f.label) + req + inner + '</label>';
  }
  var editing = null;
  function openForm(kind, id) {
    var def = S.schema[kind];
    var rec = id ? rowsOf(kind).filter(function (r) { return r.id === id; })[0] : null;
    editing = { kind: kind, id: id };
    var vals = rec || { active: true, duration_unit: 'menit', price_style: 'k', color: '#0022ff' };
    $('#card').innerHTML = '<h3>' + (id ? 'Ubah ' : 'Tambah ') + esc(def.singular) + '</h3><form id="form">' +
      def.fields.map(function (f) { return fieldHtml(f, vals[f.k]); }).join('') +
      '<div class="err" id="ferr"></div><div class="foot"><button type="button" class="btn ghost" id="cancel">Batal</button><button class="btn" id="save">Simpan</button></div></form>';
    $('#modal').classList.add('on');
  }
  function closeForm() { $('#modal').classList.remove('on'); editing = null; }
  document.addEventListener('click', function (e) {
    if (e.target.id === 'cancel' || e.target.id === 'modal') closeForm();
    var fill = e.target.closest && e.target.closest('[data-fill]');
    if (fill) { var inp = $('[data-k="' + fill.dataset.fill + '"]'); inp.value = fill.dataset.val; }
    var col = e.target.closest && e.target.closest('[data-color]');
    if (col) $('[data-k="color"]').value = col.dataset.color;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (editing) closeForm(); else endDrag(false); } });

  // Perkecil foto di browser (maks 1600px) sebelum diunggah
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var out = c.toDataURL('image/webp', 0.85);
        if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', 0.85);
        resolve(out);
      };
      img.onerror = function () { reject(new Error('Gambar tidak bisa dibaca.')); };
      img.src = url;
    });
  }
  document.addEventListener('change', async function (e) {
    if (e.target.id !== 'imgFile' || !e.target.files[0]) return;
    var msg = $('#imgMsg'); msg.textContent = 'Mengunggah…';
    $('#save').disabled = true;
    try {
      var dataUrl = await shrink(e.target.files[0]);
      var url = await run('api_upload', dataUrl, e.target.files[0].name);
      $('[data-k="image"]').value = url;
      var prev = $('#imgPrev'); prev.src = url; prev.style.display = '';
      msg.textContent = 'Foto terunggah.';
    } catch (err) { msg.textContent = err.message; msg.style.color = '#d22'; }
    $('#save').disabled = false;
  });

  document.addEventListener('submit', async function (e) {
    if (e.target.id !== 'form') return;
    e.preventDefault();
    var def = S.schema[editing.kind], rec = {};
    def.fields.forEach(function (f) {
      var el = $('[data-k="' + f.k + '"]', e.target);
      rec[f.k] = f.t === 'bool' ? el.checked : el.value.trim ? (f.t === 'list' ? el.value.replace(/\r/g, '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean).join('\n') : el.value.trim()) : el.value;
    });
    var missing = def.fields.filter(function (f) { return f.req && (rec[f.k] === '' || rec[f.k] === undefined); })[0];
    if (missing) { $('#ferr').textContent = '"' + missing.label + '" wajib diisi.'; return; }
    var rows = rowsOf(editing.kind).slice();
    if (editing.id) rows = rows.map(function (r) { return r.id === editing.id ? Object.assign({ id: r.id }, rec) : r; });
    else rows.push(Object.assign({ id: '' }, rec));
    if (def.fields.some(function (f) { return f.k === 'is_featured'; }) && rec.is_featured) {
      rows = rows.map(function (r, i) { if (editing.id ? r.id !== editing.id : i !== rows.length - 1) r.is_featured = false; return r; });
    }
    $('#save').disabled = true;
    var kind = editing.kind;
    if (await persist(kind, rows, 'Tersimpan.')) { closeForm(); render(); } else $('#save').disabled = false;
  });

  /* ---------- Info studio ---------- */
  var GROUPS = [
    ['Studio & lokasi', { studio_name: 'Nama studio', city: 'Kota', address: 'Alamat|area', latitude: 'Latitude', longitude: 'Longitude', maps_url: 'Link Google Maps', open_days: 'Hari buka', open_hours: 'Jam buka', last_session: 'Sesi terakhir', ticker: 'Teks berjalan di atas' }],
    ['Kontak & sosial media', { whatsapp: 'Nomor WhatsApp (628…)', wa_message: 'Awal pesan WhatsApp', email: 'Email', instagram: 'Instagram (tanpa @)', tiktok: 'TikTok (tanpa @)', facebook: 'Link Facebook' }],
    ['Teks halaman depan', { hero_line1: 'Judul baris 1', hero_line2: 'Judul baris 2', hero_highlight: 'Kata disorot (biru)', hero_text: 'Kalimat pembuka|area', proof_rating: 'Rating', proof_text: 'Teks di samping rating' }],
    ['Bagian yang ditampilkan', { proof_show: 'Tampilkan rating|bool', show_frames: 'Tampilkan bagian Frame|bool', show_booth: 'Tampilkan Try the booth|bool', show_instagram: 'Tampilkan Instagram|bool' }],
    ['Daftar pilihan cepat (pisahkan dengan koma)', { gallery_categories: 'Kategori galeri', options_package_tag: 'Label paket', options_package_note: 'Catatan harga', options_frame_type: 'Jenis frame', options_frame_size: 'Ukuran frame', options_frame_label: 'Label frame' }],
    ['Google', { meta_title: 'Judul di Google', meta_description: 'Deskripsi di Google|area' }]
  ];
  function renderInfo() {
    var h = '<div class="panel"><div class="head"><h2>Info Studio<small>Teks, kontak, dan bagian situs.</small></h2><button class="btn" id="infoSave">Simpan</button></div><form id="info">';
    GROUPS.forEach(function (g) {
      h += '<div class="grp">' + esc(g[0].toUpperCase()) + '</div>';
      Object.keys(g[1]).forEach(function (k) {
        var parts = g[1][k].split('|'), label = parts[0], kind = parts[1], v = S.settings[k] == null ? '' : S.settings[k];
        if (kind === 'bool') h += '<label class="switch"><input type="checkbox" data-s="' + k + '"' + (v === '1' ? ' checked' : '') + '> ' + esc(label) + '</label>';
        else h += '<label class="f">' + esc(label) + (kind === 'area' ? '<textarea data-s="' + k + '">' + esc(v) + '</textarea>' : '<input type="text" data-s="' + k + '" value="' + esc(v) + '">') + '</label>';
      });
    });
    $('#view').innerHTML = h + '</form></div>';
  }
  document.addEventListener('click', async function (e) {
    if (e.target.id !== 'infoSave') return;
    var obj = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function (el) { obj[el.dataset.s] = el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value.trim(); });
    e.target.disabled = true;
    try { S.settings = await run('api_saveSettings', obj); setDirty(true); toast('Tersimpan.'); } catch (err) { toast(err.message, true); }
    e.target.disabled = false;
  });

  function render() { if (tab === 'info') renderInfo(); else renderList(); }

  /* ---------- Terbitkan ---------- */
  $('#publish').addEventListener('click', async function () {
    var b = this; b.disabled = true; b.textContent = 'Menerbitkan…';
    try { var r = await run('api_publish'); toast(r.message); setDirty(false); } catch (e) { toast(e.message, true); }
    b.textContent = 'Terbitkan ke situs'; b.disabled = false;
  });

  /* ---------- Mulai ---------- */
  run('api_bootstrap').then(function (s) {
    S = s; $('#who').textContent = s.email;
    $('#publish').disabled = false;
    if (!s.github) $('#publish').title = 'Penerbitan ke GitHub belum diatur; situs membaca langsung dari Sheets.';
    renderTabs(); render();
  }).catch(function (e) {
    $('#view').innerHTML = '<div id="gate"><h2>Tidak bisa masuk</h2><p>' + esc(e.message) + '</p></div>';
  });
})();
</script>
</body>
</html>
